version: '3.8'


networks:
  smartcity_net:
    name: smartcity_net

services:
  mqtt:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - smartcity_net

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - smartcity_net

  storage:
    build: .
    command: python Storage_Immagini.py
    ports:
      - "5000:5000"
    volumes:
      - ./Logica_di_Test/Data_Pool:/app/archivio_foto
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - smartcity_net
    depends_on:
      - redis

  gateway:
    build: .
    command: python Gateway_IoT.py
    environment:
      - REDIS_HOST=redis
      - MQTT_BROKER=mqtt
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - smartcity_net
    depends_on:
      - storage
      - mqtt
      - redis

  orchestrator:
    build: .
    command: python AI_Orchestrator.py
    environment:
      - REDIS_HOST=redis
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Alerts_CAP:/app/alerts
    networks:
      - smartcity_net
    depends_on:
      - gateway

  dashboard:
    build: ./dashboard
    ports:
      - "8080:8080"
    environment:
      - MQTT_BROKER=mqtt
    networks:
      - smartcity_net
    depends_on:
      - mqtt