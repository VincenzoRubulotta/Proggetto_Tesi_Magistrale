version: '3.8'

networks:
  smartcity_net:
    external: true

services:
  mic_ambientale:
    build: .
    stdin_open: true 
    tty: true     
    volumes:
      - ./Data_Pool:/app/Data_Pool
    environment:
      - MQTT_BROKER=mqtt
      - STORAGE_UPLOAD_URL=http://storage:5000/upload
      - DEVICE_ID=MIC_EST
      - DEVICE_NAME=Mic_Piazza_Est
      - DEVICE_TYPE=microfono
      - IS_MOBILE=False
      - SPECIALIZATIONS=sirene,esplosioni,rumori_anomali
      - LATITUDE=37.514077
      - LONGITUDE=15.092305
    networks:
      - smartcity_net

  sensore_temp:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - ./Data_Pool:/app/Data_Pool
    environment:
      - MQTT_BROKER=mqtt
