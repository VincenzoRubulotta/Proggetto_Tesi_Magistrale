version: '3.8'

networks:
  smartcity_net:
    external: true

services:
  mic_ambientale:
    build: .
    stdin_open: true 
    tty: true     
    volumes:
      - ./Data_Pool:/app/Data_Pool
    environment:
      - MQTT_BROKER=mqtt
      - STORAGE_UPLOAD_URL=http://storage:5000/upload
      - DEVICE_ID=MIC_EST
      - DEVICE_NAME=Mic_Piazza_Est
      - DEVICE_TYPE=microfono
      - IS_MOBILE=False
      - SPECIALIZATIONS=sirene,esplosioni,rumori_anomali
      - LATITUDE=37.5112
      - LONGITUDE=15.0890
    networks:
      - smartcity_net

  sensore_temp:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - ./Data_Pool:/app/Data_Pool
    environment:
      - MQTT_BROKER=mqtt
      - STORAGE_UPLOAD_URL=http://storage:5000/upload
      - DEVICE_ID=TEMP_01
      - DEVICE_NAME=Termometro_Piazza
      - DEVICE_TYPE=sensore_temperatura
      - IS_MOBILE=False
      - SPECIALIZATIONS=incendi,rilevamento_calore
      - LATITUDE=37.5110
      - LONGITUDE=15.0880
    networks:
      - smartcity_net

  telecamera_fissa:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - ./Data_Pool:/app/Data_Pool
    environment:
      - MQTT_BROKER=mqtt
      - STORAGE_UPLOAD_URL=http://storage:5000/upload
      - DEVICE_ID=CAM_NORD
      - DEVICE_NAME=Cam_Piazza_Nord
      - DEVICE_TYPE=telecamera
      - IS_MOBILE=False
      - SPECIALIZATIONS=incendi,traffico
      - LATITUDE=37.5115
      - LONGITUDE=15.0888
    networks:
      - smartcity_net

  drone_01:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - ./Data_Pool:/app/Data_Pool
    environment:
      - MQTT_BROKER=mqtt
      - STORAGE_UPLOAD_URL=http://storage:5000/upload
      - DEVICE_ID=DRONE_01
      - DEVICE_NAME=Drone_Ricognitore_Alpha
      - DEVICE_TYPE=drone
      - IS_MOBILE=True
      - SPECIALIZATIONS=incidenti,incendi,ricerca_visiva
      - LATITUDE=37.5125 
      - LONGITUDE=15.0895
    networks:
      - smartcity_net

  drone_02:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - ./Data_Pool:/app/Data_Pool
    environment:
      - MQTT_BROKER=mqtt
      - STORAGE_UPLOAD_URL=http://storage:5000/upload
      - DEVICE_ID=DRONE_02
      - DEVICE_NAME=Drone_Ricognitore_Beta
      - DEVICE_TYPE=drone
      - IS_MOBILE=True
      - SPECIALIZATIONS=incidenti,incendi,primo_soccorso
      - LATITUDE=37.5180 
      - LONGITUDE=15.0950
    networks:
      - smartcity_net