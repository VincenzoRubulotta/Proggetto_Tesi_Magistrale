      - DEVICE_ID=TEMP_01
      - DEVICE_NAME=Termometro_Piazza
      - DEVICE_TYPE=sensore_temperatura
      - IS_MOBILE=False
      - SPECIALIZATIONS=incendi,rilevamento_calore
      - LATITUDE=37.514206
      - LONGITUDE=15.092822
    networks:
      - smartcity_net

  telecamera_fissa:
