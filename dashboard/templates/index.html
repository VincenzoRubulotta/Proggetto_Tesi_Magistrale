<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Smart City - Digital Twin Command Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; }
        .logs-section { height: 45vh; overflow-x: auto; white-space: nowrap; display: flex; padding: 10px; gap: 10px; }
        .device-col { background: #1e1e1e; border: 1px solid #333; min-width: 300px; max-width: 300px; display: flex; flex-direction: column; border-radius: 8px; }
        .device-header { background: #0d6efd; color: white; padding: 8px; text-align: center; font-weight: bold; border-top-left-radius: 8px; border-top-right-radius: 8px; }
        .terminal { flex-grow: 1; padding: 10px; overflow-y: auto; font-family: monospace; font-size: 12px; background: #000; }
        #map { height: 50vh; width: 100%; border-top: 4px solid #0d6efd; }

        .custom-map-marker {
            background-color: #2b2b2b; 
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }
        .marker-mobile { border-color: #dc3545; } /* Bordo rosso per i droni */
        .marker-fixed { border-color: #0d6efd; } /* Bordo blu per i sensori fissi */
    </style>
</head>
<body>

    <h3 class="text-center py-2 m-0 bg-dark border-bottom">📡 IoT Device Logs</h3>
    <div class="logs-section" id="logs-container">
    </div>

    <div id="map"></div>

    <script>
        const socket = io({
            transports: ['websocket', 'polling']
        });

        socket.on('connect', () => {
            console.log("Connesso al server Socket.IO con ID:", socket.id);
        });

        socket.on('connect_error', (error) => {
            console.error("Errore di connessione Socket.IO:", error);
        });
        
        socket.on('new_log', function(data) {
            let deviceId = data.id_dispositivo;
            let container = document.getElementById('logs-container');
            let termId = 'term-' + deviceId;

            if (!document.getElementById(termId)) {
                let col = document.createElement('div');
                col.className = 'device-col';
                col.innerHTML = `
                    <div class="device-header">${deviceId}</div>
                    <div class="terminal" id="${termId}"></div>
                `;
                container.appendChild(col);
            }

            let terminal = document.getElementById(termId);
            
            let logColor = "#0f0"; // Verde di default
            let msgUpper = data.messaggio.toUpperCase();
            
            if (msgUpper.includes("CRITICO") || msgUpper.includes("EMERGENZA") || msgUpper.includes("BOATO")) {
                logColor = "#ff4c4c"; // Rosso
            } else if (msgUpper.includes("ANOMALIA") || msgUpper.includes("RICHIEDE VERIFICA")) {
                logColor = "#ffcc00"; // Giallo
            } else if (msgUpper.includes("CESSATO ALLARME") || msgUpper.includes("NORMALE")) {
                logColor = "#00d2ff"; // Azzurro
            }

            terminal.innerHTML += `<div style="color: ${logColor};">[${data.timestamp}] ${data.messaggio}</div>`;
            terminal.scrollTop = terminal.scrollHeight;
        });

        var map = L.map('map').setView([37.514511, 15.092750], 18);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var markers = {};

        socket.on('map_update', function(data) {
            let lat = data.posizione.coordinate.latitudine;
            let lon = data.posizione.coordinate.longitudine;
            let deviceId = data.id_dispositivo;

            if (data.is_mobile) {
                lat += (Math.random() - 0.5) * 0.00015;
                lon += (Math.random() - 0.5) * 0.00015;
            }
            
            if (markers[deviceId]) {
                markers[deviceId].setLatLng([lat, lon]);
            } else {
                let iconEmoji = "📍";
                switch(data.tipo_dispositivo) {
                    case 'drone': iconEmoji = "🚁"; break;
                    case 'telecamera': iconEmoji = "📹"; break;
                    case 'microfono': iconEmoji = "🎙️"; break;
                    case 'sensore_temperatura': iconEmoji = "🌡️"; break;
                }

                let borderClass = data.is_mobile ? 'marker-mobile' : 'marker-fixed';

                let customIcon = L.divIcon({
                    html: `<div class="custom-map-marker ${borderClass}" style="width: 36px; height: 36px;">${iconEmoji}</div>`,
                    className: '', 
                    iconSize: [36, 36],
                    iconAnchor: [18, 18],
                    popupAnchor: [0, -20]
                });

                let marker = L.marker([lat, lon], {icon: customIcon}).addTo(map);
                
                let powerText = (data.is_mobile && data.batteria !== undefined && data.batteria !== "N/D") 
                    ? `<br>🔋 Batteria: ${data.batteria}%` 
                    : `<br>🔌 Rete Elettrica`;

                let specText = (data.specializzazioni && data.specializzazioni.length > 0) 
                    ? `<br>🛠 Spec: ${data.specializzazioni.join(', ').replace(/_/g, ' ')}` 
                    : '';

                marker.bindPopup(`<b>${deviceId}</b><br>🏷 Tipo: ${data.tipo_dispositivo.replace(/_/g, ' ')}${powerText}${specText}`);
                markers[deviceId] = marker;
            }
        });

        var emergencyCircles = {};

        socket.on('emergency_circle', function(data) {
            let epi = data.epicentro_id;
            
            if (emergencyCircles[epi]) {
                map.removeLayer(emergencyCircles[epi]);
                delete emergencyCircles[epi];
            }
            
            if (data.stato === "NORMALE") {
                return;
            }
            
            let circleColor = data.stato === "CRITICO" ? "#ff4c4c" : "#ffcc00";
            
            let circle = L.circle([data.lat, data.lon], {
                color: circleColor,
                fillColor: circleColor,
                fillOpacity: 0.2,
                radius: 100 
            }).addTo(map);
            
            emergencyCircles[epi] = circle;
        });
    </script>
</body>
</html>
